<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{Title}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family: 'Segoe UI', Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06);">

                    <!-- Header -->
                    <tr>
                        <td style="background-color:#111827; padding:32px 40px; text-align:center;">
                            <h1 style="margin:0; color:#ffffff; font-size:22px; font-weight:600;">RoomReservation</h1>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding:40px; text-align:center;">
                            <p style="margin:0 0 28px; color:#4B5563; font-size:15px; line-height:1.6;">
                                {{CodePurpose}}
                            </p>

                            <div style="display:inline-block; background-color:#F3F4F6; border:1px solid #E5E7EB; border-radius:10px; padding:20px 36px; margin-bottom:24px;">
                                <span style="font-size:32px; font-weight:700; letter-spacing:8px; color:#111827;">{{Code}}</span>
                            </div>

                            <p style="margin:0; color:#9CA3AF; font-size:13px; line-height:1.5;">
                                Kod jest ważny przez <strong>{{ExpirationMinutes}} minut</strong>.<br>
                            </p>
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td style="padding:0 40px;">
                            <hr style="border:none; border-top:1px solid #E5E7EB; margin:0;">
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:24px 40px 32px;">
                            <p style="margin:0; color:#9CA3AF; font-size:12px; line-height:1.6; text-align:center;">
                                © 2026 RoomReservation. Wszelkie prawa zastrzeżone.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
