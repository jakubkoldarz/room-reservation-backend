<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{Title}}</title>
</head>
<body style="margin:0; padding:0; background-color:#EEF0F4; font-family: 'Segoe UI', Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EEF0F4; padding:48px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(17,24,39,0.08);">

                    <!-- Accent bar -->
                    <tr>
                        <td style="height:6px; background:linear-gradient(90deg,#3B82F6,#2563EB);"></td>
                    </tr>

                    <!-- Header -->
                    <tr>
                        <td style="padding:36px 40px 0;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td>
                                        <span style="display:inline-block; font-size:13px; font-weight:600; letter-spacing:0.4px; color:#9CA3AF; text-transform:uppercase;">RoomReservation</span>
                                    </td>
                                    <td align="right">
                                        <span style="display:inline-block; background-color:#EFF6FF; color:#2563EB; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; letter-spacing:0.3px;">
                                            WERYFIKACJA
                                        </span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Title -->
                    <tr>
                        <td style="padding:20px 40px 8px;">
                            <h1 style="margin:0; color:#111827; font-size:20px; font-weight:700; line-height:1.3;">
                                {{Title}}
                            </h1>
                        </td>
                    </tr>

                    <!-- Purpose text -->
                    <tr>
                        <td style="padding:8px 40px 0;">
                            <p style="margin:0; color:#6B7280; font-size:14px; line-height:1.6;">
                                {{CodePurpose}}
                            </p>
                        </td>
                    </tr>

                    <!-- Code card -->
                    <tr>
                        <td style="padding:24px 40px 0;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F9FAFB; border:1px solid #F0F1F3; border-radius:12px;">
                                <tr>
                                    <td align="center" style="padding:28px 24px;">
                                        <span style="font-size:32px; font-weight:700; letter-spacing:8px; color:#111827;">{{Code}}</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Expiration note -->
                    <tr>
                        <td style="padding:20px 40px 0;">
                            <p style="margin:0; color:#9CA3AF; font-size:12.5px; line-height:1.6;">
                                Kod jest ważny przez <strong style="color:#6B7280;">{{ExpirationMinutes}} minut</strong>. Jeśli to nie Ty prosiłeś o ten kod, zignoruj tę wiadomość.
                            </p>
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td style="padding:32px 40px 0;">
                            <hr style="border:none; border-top:1px solid #EEF0F3; margin:0;">
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:24px 40px 36px;">
                            <p style="margin:0; color:#B0B4BC; font-size:11.5px; line-height:1.6; text-align:center;">
                                © 2026 RoomReservation. Wszelkie prawa zastrzeżone.<br>
                                To wiadomość automatyczna &mdash; prosimy na nią nie odpowiadać.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
